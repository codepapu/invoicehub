server.servlet.context-path=/invoicehub
server.tomcat.additional-tld-skip-patterns=htmlunit-*.jar,jetty-*.jar,c3p0-*.jar,mchange-commons-*.jar

# Embedded in-memory HSQLDB: data is recreated (and reloaded from import.sql) on every start
spring.datasource.url=jdbc:hsqldb:mem:invoicehub
spring.datasource.username=SA
spring.datasource.password=
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

logging.level.org.openxava=INFO
